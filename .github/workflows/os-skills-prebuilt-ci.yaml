name: Test OS Skills raw package

on:
  pull_request:
    paths:
      - 'src/os-skills/**'
      - '.github/actions/build-os-skills-prebuilt/**'
      - '.github/actions/prebuilt-rust-common/**'
      - '.github/workflows/os-skills-prebuilt-ci.yaml'
      - '.github/workflows/release.yaml'
      - '.github/workflows/release-preview.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Verify OS Skills raw package
    runs-on: anolisa-k8s-general-ci-x64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install component test dependencies
        run: python3 -m pip install -r src/os-skills/tests/requirements.txt
      - name: Run tests that live beside the script they cover
        # `discover -s src/os-skills/tests` cannot reach these: the component
        # path contains a hyphen, so discovery skips it, and unittest only
        # descends into packages. They were therefore written, kept correct by
        # hand, and never run by CI. Moving them into src/os-skills/tests is the
        # eventual fix (see the guard in that directory); until then this loop
        # runs whatever is still beside its script, and goes quiet once they
        # are moved.
        run: |
          failed=0
          while IFS= read -r suite; do
            echo "== $suite"
            python3 "$suite" || failed=1
          done < <(find src/os-skills -path '*/scripts/test_*.py' | sort)
          exit "$failed"
      - name: Verify raw package and action
        run: |
          python3 -m unittest discover -s src/os-skills/tests
          python3 .github/actions/prebuilt-rust-common/test_plan_matrix.py
          bash .github/actions/build-os-skills-prebuilt/test.sh
